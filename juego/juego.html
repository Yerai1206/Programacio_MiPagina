<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ODM Runner · Yerai Piera Langa</title>
  <meta name="description" content="Minijuego ODM Runner en canvas: scroll horizontal, equipo de maniobras, raycasting, titanes y récord local.">
  <meta name="author" content="Yerai Piera Langa">
  <link rel="icon" href="../favicon.svg">
  <link rel="stylesheet" href="juego.css">
</head>

<body>
  <header class="game-header">
    <a class="back" href="../index.html">← Volver al portafolio</a>
    <h1>ODM Runner</h1>
  </header>

  <main class="game-main">
    <div class="game-shell">
      <canvas id="game" role="img" aria-label="Juego ODM Runner"></canvas>
    </div>

    <div class="game-controls">
      <div class="buttons">
        <button id="start-btn" type="button">Iniciar</button>
        <button id="restart-btn" type="button">Reiniciar</button>
        <button id="pause-btn" type="button">Pausa</button>
      </div>

      <div class="hud" aria-live="polite">
        <span>Puntos <b id="score">0</b></span>
        <span>Récord <b id="best">0</b></span>
      </div>
    </div>

    <section class="instructions">
      <h2>Controles</h2>
      <ul>
        <li><b>Clic mantenido</b> o <b>dedo mantenido</b>: engancha el equipo de maniobras a la superficie más cercana.</li>
        <li><b>Espacio</b>: ataque para cortar obstáculos y titanes.</li>
        <li><b>P</b>: pausa.</li>
        <li><b>R</b>: reiniciar.</li>
      </ul>
    </section>
  </main>

  <script src="juego.js"></script>
</body>
</html>
